{% extends "admin/base.html" %}
{% block title %}Log in · NutriGo Admin{% endblock %}
{% block login %}
<div class="card" style="padding: 32px 28px;">
  <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 22px;">
    <span style="width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
                 background: linear-gradient(135deg, #22c55e, #0f7a37); box-shadow: 0 6px 18px rgba(34, 197, 94, .35);">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 4 13c0-6 6-10 16-10 0 10-4 16-10 16"/><path d="M4 21c3-4 6-7 10-9"/></svg>
    </span>
    <div>
      <div style="font-weight: 700; font-size: 20px; letter-spacing: -.02em;">Nutri<span style="color: var(--brand)">Go</span></div>
      <div style="color: var(--muted); font-size: 13px;">Admin dashboard</div>
    </div>
  </div>
  <h1 style="font-size: 20px;">Welcome back</h1>
  <p class="sub" style="margin-bottom: 18px;">Log in with the dashboard password (<code>NUTRIGO_ADMIN_PASSWORD</code>).</p>
  <form method="post">
    <label style="display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 500; margin-bottom: 14px;">
      Password
      <input type="password" name="password" autofocus required style="width: 100%;">
    </label>
    <button style="width: 100%; justify-content: center; padding: 11px;">Log in</button>
  </form>
</div>
{% endblock %}
